<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Nomad - Home</title>
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <a href="HomePage.html" class="brand">Study Nomad</a>
        <nav class="nav-center">
          <a class="nav-link active" href="HomePage.html">Feed</a>
          <a class="nav-link" href="ExplorePage.html">Explore Map</a>
          <a class="nav-link" href="MyGroupsPage.html" id="nav-mygroups">My Groups</a>
        </nav>
        <div class="topbar-actions">
          <button class="host-btn">+ Host a Session</button>
          <div class="avatar" role="button" tabindex="0">S</div>
        </div>
      </header>

      <section class="hero">
        <h1>Upcoming Sessions</h1>
        <p>Discover drop-in study groups happening soon.</p>
        <hr class="hero-divider" />
      </section>

      <section class="filters">
        <button class="filter-btn active" onclick="applyFilter('all', this)">All</button>
        <button class="filter-btn" onclick="applyFilter('today', this)">Today</button>
        <button class="filter-btn" onclick="applyFilter('near', this)">Near Me</button>
        <button class="filter-btn" onclick="applyFilter('courses', this)">My Courses</button>
      </section>

      <main class="sessions-grid" id="sessions-grid"></main>
      <div id="no-results" style="display:none; text-align:center; padding:60px 20px; color:#787878; font-size:16px;">
        No sessions match this filter right now.
      </div>
    </div>

    <script src="auth.js"></script>
    <script>
      var currentFilter = 'all';

      function renderSessionCard(s, joined) {
        var avatars = (s.attendees || []).slice(0, 5).map(function(a) {
          return '<div class="mini-avatar ' + a.color + '">' + a.initials + '</div>';
        }).join('');
        var right = joined.indexOf(s.id) > -1
          ? '<span class="joined-badge">Joined</span>'
          : '<span class="spots">' + s.spots + ' spots left</span>';

        return (
          '<a class="session-card-link" href="SessionDetail.html?id=' + s.id + '" data-day="' + (s.day || 'today') + '" data-dist="' + (s.dist || 'near') + '" data-mine="' + (s.mine ? 'true' : 'false') + '">' +
            '<article class="session-card">' +
              '<div class="session-top"><span class="tag">' + s.tag + '</span><span class="time">' + s.time + '</span></div>' +
              '<h2 class="session-title">' + s.title + '</h2>' +
              '<div class="location"><span class="location-icon"></span><span>' + s.location + '</span></div>' +
              '<p class="description">' + (s.description || s.about || '') + '</p>' +
              '<hr class="card-divider" />' +
              '<div class="card-footer"><div class="avatars">' + avatars + '</div>' + right + '</div>' +
            '</article>' +
          '</a>'
        );
      }

      function renderFeed() {
        var sessions = window.StudyNomad.getSessions();
        var joined = window.StudyNomad.getJoined();
        document.getElementById('sessions-grid').innerHTML = sessions.map(function(s) {
          return renderSessionCard(s, joined);
        }).join('');
        applyFilter(currentFilter, document.querySelector('.filter-btn.active'));
      }

      function applyFilter(filter, btn) {
        currentFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
        if (btn) btn.classList.add('active');

        var cards = document.querySelectorAll('#sessions-grid .session-card-link');
        var visible = 0;
        var days = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
        var todayName = days[new Date().getDay()];

        cards.forEach(function(card) {
          var day = card.getAttribute('data-day');
          var dist = card.getAttribute('data-dist');
          var mine = card.getAttribute('data-mine');
          var show = filter === 'all'
            || (filter === 'today' && (day === 'today' || day === todayName))
            || (filter === 'near' && dist === 'near')
            || (filter === 'courses' && mine === 'true');
          card.style.display = show ? 'block' : 'none';
          if (show) visible++;
        });

        document.getElementById('no-results').style.display = visible === 0 ? 'block' : 'none';
      }

      function boot() {
        window.addEventListener('sn:sessions-updated', renderFeed);
        window.addEventListener('sn:host-created', function() {
          window.location.href = 'MyGroupsPage.html';
        });
        renderFeed();
      }

      if (window.StudyNomad) boot();
      else window.addEventListener('sn:ready', boot, { once: true });
    </script>
  </body>
</html>
