<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Nomad - Explore Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      #map { width: 100%; height: 100%; min-height: 560px; border-radius: var(--radius-md); }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <a href="HomePage.html" class="brand">Study Nomad</a>
        <nav class="nav-center">
          <a class="nav-link" href="HomePage.html">Feed</a>
          <a class="nav-link active" href="ExplorePage.html">Explore Map</a>
          <a class="nav-link" href="MyGroupsPage.html" id="nav-mygroups">My Groups</a>
        </nav>
        <div class="topbar-actions">
          <button class="host-btn">+ Host a Session</button>
          <div class="avatar" role="button" tabindex="0">S</div>
        </div>
      </header>

      <section class="hero">
        <h1>Explore Map</h1>
        <p>Find study sessions happening near you.</p>
        <hr class="hero-divider" />
      </section>

      <div class="explore-layout">
        <aside class="explore-sidebar">
          <div class="explore-search">
            <input type="text" id="search-input" placeholder="Search by course or location..." oninput="filterSidebar(this.value)" />
          </div>
          <div class="explore-list" id="explore-list"></div>
        </aside>
        <div class="explore-map-area" style="padding:0;">
          <div id="map"></div>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="auth.js"></script>
    <script>
      var map = L.map('map', { zoomControl: true }).setView([35.159, 33.318], 15);
      var markersLayer = L.layerGroup().addTo(map);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19
      }).addTo(map);

      function makeIcon(color) {
        var svg =
          '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="40" viewBox="0 0 30 40">' +
            '<path d="M15 0C6.716 0 0 6.716 0 15c0 9.375 15 25 15 25S30 24.375 30 15C30 6.716 23.284 0 15 0z" fill="' + color + '"/>' +
            '<circle cx="15" cy="15" r="6" fill="white"/>' +
          '</svg>';
        return L.divIcon({ html: svg, className: '', iconSize: [30, 40], iconAnchor: [15, 40], popupAnchor: [0, -42] });
      }

      function renderSidebar(list) {
        var el = document.getElementById('explore-list');
        if (!list.length) {
          el.innerHTML = '<div style="padding:20px;color:#787878;font-size:14px;text-align:center;">No sessions found.</div>';
          return;
        }
        el.innerHTML = list.map(function(s) {
          return (
            '<a class="explore-item" href="SessionDetail.html?id=' + s.id + '">' +
              '<div class="explore-item-top"><div class="explore-item-title">' + s.title + '</div><span class="explore-item-tag">' + s.tag + '</span></div>' +
              '<div class="explore-item-meta"><span class="location-icon"></span>' + s.location + ' | ' + s.time + '</div>' +
            '</a>'
          );
        }).join('');
      }

      function renderMap(list) {
        markersLayer.clearLayers();
        list.forEach(function(s) {
          if (typeof s.lat !== 'number' || typeof s.lng !== 'number') return;
          var marker = L.marker([s.lat, s.lng], { icon: makeIcon(s.color || '#0f0f10') }).addTo(markersLayer);
          marker.bindPopup(
            '<div style="padding:8px 2px;min-width:180px;">' +
              '<strong>' + s.tag + '</strong><br>' +
              s.title + '<br>' +
              '<span style="color:#787878">' + s.location + '<br>' + s.time + '</span><br><br>' +
              '<a href="SessionDetail.html?id=' + s.id + '" class="popup-btn">View Session</a>' +
            '</div>'
          );
        });
      }

      function getFiltered(q) {
        var sessions = window.StudyNomad.getSessions();
        var query = (q || '').toLowerCase().trim();
        if (!query) return sessions;
        return sessions.filter(function(s) {
          return s.title.toLowerCase().indexOf(query) > -1
            || s.tag.toLowerCase().indexOf(query) > -1
            || s.location.toLowerCase().indexOf(query) > -1;
        });
      }

      function filterSidebar(value) {
        var list = getFiltered(value);
        renderSidebar(list);
        renderMap(list);
      }

      function renderAll() {
        var list = getFiltered(document.getElementById('search-input').value);
        renderSidebar(list);
        renderMap(list);
      }

      function boot() {
        window.addEventListener('sn:sessions-updated', renderAll);
        renderAll();
      }

      if (window.StudyNomad) boot();
      else window.addEventListener('sn:ready', boot, { once: true });
    </script>
  </body>
</html>
